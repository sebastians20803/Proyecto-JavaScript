<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>
<body>
    <header>
        <div class="logoAcme">
            <img src="./sources/AcmeSchool.png" alt="Logo Acme School" class="acme">
        </div>
        <nav class="nav">
            <a href="../indexMain.html">Resolver examen</a>
            <a href="./Login/login.html">Login</a>
        </nav>

        <div class="access">
            <h1>Acceso público</h1>
        </div>
    </header>
    
    <section class="section__login">
        <div class="img__container"><img src="https://qawerk.es/wp-content/uploads/2021/05/cover-3.png" alt="" class="body__img"></div>

    <form action="#" class="form">
        <h1 class="form__titulo">Iniciar sesion</h1>
        <label for="email">Correo electronico</label>
        <input type="email" class="email__input" id="emailInput" placeholder="Ingresa tu correo electronico">

        <label for="password">Contraseña</label>
        <input type="password" class="password__input" id="passwordInput" placeholder="Ingresa tu contraseña">

        <p class="form__texto"></p>

        <button class="form__btn" id="formBtn" type="submit">Ingresar</button>
    </form>
    </section>

    <script src="login.js"></script>
</body>
</html>
