<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>
<body>
    <header>
        <div class="header__img">
            <img src="../sources/logo.png" alt="" class="img__header"> 
        </div>
       <a href="#" class="header__link">Resolver examen</a>
       <a href="#" class="header__link">Login</a>
    </header>
    
    <section class="section__login">
        <div class="img__container"><img src="https://qawerk.es/wp-content/uploads/2021/05/cover-3.png" alt="" class="body__img"></div>

    <form action="#" class="form">
        <h1 class="form__titulo">Iniciar sesion</h1>
        <label for="email">Correo electronico</label>
        <input type="email" class="email__input" id="emailInput" placeholder="Ingresa tu correo electronico" value="sebastiancampus@gmail.com">

        <label for="password">Contraseña</label>
        <input type="password" class="password__input" id="passwordInput" placeholder="Ingresa tu contraseña" value="Sebastian123!">

        <p class="form__texto"></p>

        <button class="form__btn" id="formBtn" type="button" onclick="validarInputs()">Ingresar</button>
    </form>
    </section>

    <script src="login.js"></script>
</body>
</html>
